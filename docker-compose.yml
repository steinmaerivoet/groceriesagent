name: groceries

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mealie:
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MEALIE_PORT}:9000"
    environment:
      ALLOW_SIGNUP: "false"
      BASE_URL: ${MEALIE_BASE_URL}
      TZ: ${TZ}
      DB_ENGINE: postgres
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mealie-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/api/app/about')\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # One-shot seeder: `docker compose run --rm seed` (or `make seed`)
  seed:
    image: python:3.12-alpine
    profiles: ["tools"]
    depends_on:
      mealie:
        condition: service_healthy
    working_dir: /work
    environment:
      MEALIE_URL: http://mealie:9000
      MEALIE_ADMIN_EMAIL: ${MEALIE_ADMIN_EMAIL}
      MEALIE_ADMIN_PASSWORD: ${MEALIE_ADMIN_PASSWORD}
    volumes:
      - ./dev/seed:/work/seed:ro
      - ./.env:/work/.env
    entrypoint: ["python", "-u", "seed/seed.py"]

volumes:
  postgres-data:
  mealie-data:
